<!DOCTYPE html>
<html>
<head>
  <title>Car Rental App</title>
  <link rel="stylesheet" href="style.css">
  <!-- Import Supabase JS library (isa lang dapat, tapusin ang src) -->
  <script src="https://unpkg.com/@supabase/supabase-js"></script>
  <!-- Import custom script -->
  <script src="script.js" defer></script>
</head>
<body>
  <h1>Car Rental App</h1>

  <!-- Login/Logout buttons -->
  <button id="login" onclick="login()">Login with Google</button>
  <button id="logout" onclick="logout()" style="display:none;">Logout</button>

  <!-- Dashboard -->
  <div id="dashboard" style="display:none;">
    <p>Welcome, <span id="user"></span></p>
  </div>
</body>
</html>
